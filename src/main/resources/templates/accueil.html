<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Accueil')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(title='Bienvenue sur StockIMS', active='accueil', content=~{::section})}">
<section class="welcome-page">
    <div class="welcome-panel"><div class="eyebrow">STOCKIMS / OBSIDIENNE</div>
        <h1>Bienvenue sur <span>StockIMS</span></h1>
        <p class="lead">Un espace précis pour suivre vos articles et leurs mouvements.</p>
        <a class="button button-primary button-large" th:href="@{/articles}">Ouvrir les articles <span th:replace="~{fragments/icons :: icon('arrow')}"></span></a>
    </div>
    <div class="operation-grid" aria-label="Opérations disponibles">
        <article class="operation-card"><span class="operation-icon navy" th:replace="~{fragments/icons :: icon('articles')}"></span><div><h2>Référencer</h2><p>Ajoutez les articles de votre inventaire.</p></div></article>
        <article class="operation-card"><span class="operation-icon green" th:replace="~{fragments/icons :: icon('plus')}"></span><div><h2>Enregistrer une entrée</h2><p>Augmentez le stock d'un article.</p></div></article>
        <article class="operation-card"><span class="operation-icon red" th:replace="~{fragments/icons :: icon('minus')}"></span><div><h2>Enregistrer une sortie</h2><p>Suivez les quantités retirées.</p></div></article>
    </div>
</section>
</div>
</body>
</html>
